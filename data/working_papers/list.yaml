- title: "Does Affective Polarization Make Citizens More Extreme? Experimental Evidence from Chile"
  coauthors: "Loreto Cox and Carmen Le Foulon"
  book: "R&R Political Behavior"
  note: "Current Version: January 2026"
  abstract: >
      We study how affective polarization shapes ideological stances in a context of weak par tisan identities: the 2022 Constitutional Plebiscite in Chile. We show that the plebiscite produced opinion-based identities with high levels of affective polarization and motivated reasoning, exemplified by a strong cue-taking effect. Using a survey experiment with an open-ended primer, we experimentally manipulate affective polarization. We do not find that heightened affective polarization directly influences ideological extremeness. However, a second experiment provides mixed evidence of an indirect impact on ideology via strength ening the effects of cues. Thus, while affective polarization does not polarize ideology in the abstract, it may shape ideological positions due to affective responses to the speaker’s political camp. Our results suggest that even opinion-based groups based on new divides may shape how citizens interpret policy positions, raising concerns about the possibilities of democratic deliberation and agreement.

- title: "Advancing Diversity in School Leadership: Evidence from Colombia"
  coauthors: "Gregory Elacqua, Graciela Pérez-Núñez, and Juliana Iglesias"
  book: "Submitted"
  note: "Current Version: December 2025"
  abstract: >
      In Colombia, women represent 65% of the teacher workforce but only 34% of school principals, reflecting a significant gender gap in leadership. This study examines two centralized principal selection processes implemented by Colombia’s National Civil Service Commission: the 2016 nationwide process and the 2018 process targeting disadvantaged PDET regions (Development Programs with a Territorial Focus). Both processes evaluated candidates through standardized tests, minimum requirements, and assessments of education and experience, determining eligibility for leadership vacancies. Our descriptive analysis shows how selection criteria influence gender representation. In 2016, standardized testing dominated, resulting in 45% of applicants being women but only 20% qualifying, with an overall eligible-to-vacancy ratio of just 0.7%. In contrast, the 2018 PDET process prioritized context-specific competencies and practical experience, yielding 35% female eligibility despite women comprising only 38% of applicants (likely due to challenging conditions in PDET regions). Moreover, eligible candidates of both genders outnumbered vacancies by 4.5 times. These findings underscore the critical role of selection design in shaping gender representation in school leadership. However, structural barriers, such as inadequate childcare and rigid work schedules, persist as obstacles to women’s participation.
