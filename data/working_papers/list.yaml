works:

- title: "Does Affective Polarization Shape Citizens’ Ideology? Experimental Evidence of an Indirect Channel from Chile"
  coauthors: "Loreto Cox and Carmen Le Foulon"
  book: "Revision resubmitted to Political Behavior"
  note: "Current Version: July 2026"
  abstract: >
      We study how affective polarization shapes ideological stances in a context of weak partisan identities: the 2022 Constitutional Plebiscite in Chile. The plebiscite produced opinion-based identities with high levels of affective polarization and strong cue-taking effects. Within a single design and sample, we evaluate two channels through which affective polarization may shape ideology: a direct effect on citizens' own positions, and an indirect effect through cue-taking. Using a survey experiment with an open-ended primer, we experimentally manipulate the salience of affective polarization and find no impact on ideological extremeness. However, a second, cross-randomized experiment, in which the same policy statement is attributed to an in-group or an out-group speaker, reveals that for abortion, but not for the economic issue, heightened affective polarization strengthens the effect of opinion-based group cues. Thus, while affective polarization does not directly affect ideological extremeness, it may influence policy attitudes indirectly by shaping citizens' reactions to cues from opposing political camps. Our results suggest that even opinion-based groups formed around new divides may shape how citizens interpret policy positions, raising concerns about the possibilities for democratic deliberation when disagreement reflects intergroup hostility rather than substantive considerations.
